[package]
name = "rust_crates"
version = "0.1.0"
edition = "2024"

[lib]
path = "fake.rs"

[dependencies]
anyhow = { version = "1.0.100", features = ["backtrace"] }
clap = { version = "4.5.56", features = ["derive", "env"] }
ecdsa = "0.16.0"
enumflags2 = "0.7.10"
env_logger = "0.11.0"
fastrand = "2.3.0"
hex = "0.4.3"
log = "0.4.21"
num-traits = "0.2.19"
p256 = { version = "0.13.2", features = ["ecdsa"] }
proc-macro2 = "1.0.94"
quote = "1.0.39"
rsa = "0.9.6"
sha2 = { version = "0.10.8", features = ["oid"] }
syn = { version = "2.0.99", features = ["full", "extra-traits", "parsing"] }
tss-esapi = "7.6.0"
tss-esapi-sys = "0.5.0"
